<app-page-header title="Category Management"></app-page-header>

<div class="actions-bar">
  <button class="btn btn-primary" (click)="openCreateForm()">+ New Category</button>
</div>

<!-- Inline Form -->
<div class="form-card" *ngIf="showForm">
  <h3 class="form-title">{{ editingCategory ? 'Edit Category' : 'New Category' }}</h3>

  <div class="form-group">
    <label>Name *</label>
    <input type="text" class="form-control" [(ngModel)]="formName" placeholder="Category name" />
  </div>

  <div class="form-group">
    <label>Arabic Name *</label>
    <input type="text" class="form-control" [(ngModel)]="formNameAr" placeholder="اسم التصنيف" dir="rtl" />
  </div>

  <div class="form-group">
    <label>Description</label>
    <input type="text" class="form-control" [(ngModel)]="formDescription" placeholder="Optional description" />
  </div>

  <div class="form-actions">
    <button class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
    <button class="btn btn-primary" (click)="onSave()">{{ editingCategory ? 'Update' : 'Create' }}</button>
  </div>
</div>

<!-- Table -->
<div class="table-wrapper" *ngIf="categories.length > 0">
  <table class="data-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Arabic Name</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of categories">
        <td>{{ cat.name }}</td>
        <td dir="rtl">{{ cat.nameAr }}</td>
        <td>{{ cat.description || '—' }}</td>
        <td>
          <button class="btn btn-sm" (click)="openEditForm(cat)">Edit</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-empty-state *ngIf="categories.length === 0 && !showForm" message="No categories yet"></app-empty-state>
