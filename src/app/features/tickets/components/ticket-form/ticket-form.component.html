<form #ticketForm="ngForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="title">Title *</label>
    <input
      type="text"
      id="title"
      name="title"
      class="form-control"
      placeholder="Brief summary of the issue"
      [(ngModel)]="title"
      required
    />
  </div>

  <div class="form-group">
    <label for="description">Description *</label>
    <textarea
      id="description"
      name="description"
      class="form-control"
      rows="5"
      placeholder="Detailed description of the issue"
      [(ngModel)]="description"
      required
    ></textarea>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="categoryId">Category *</label>
      <select id="categoryId" name="categoryId" class="form-control" [(ngModel)]="categoryId" required>
        <option [ngValue]="null">Select category...</option>
        <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="priority">Priority</label>
      <select id="priority" name="priority" class="form-control" [(ngModel)]="priority">
        <option [ngValue]="0">Low</option>
        <option [ngValue]="1">Medium</option>
        <option [ngValue]="2">High</option>
        <option [ngValue]="3">Critical</option>
      </select>
    </div>
  </div>

  <div class="form-group" *ngIf="isAdmin">
    <label for="departmentId">Department</label>
    <select id="departmentId" name="departmentId" class="form-control" [(ngModel)]="departmentId">
      <option [ngValue]="null">Select department...</option>
      <option *ngFor="let dept of departments" [ngValue]="dept.id">{{ dept.name }}</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="ticketForm.invalid">
      {{ isEditMode ? 'Update Ticket' : 'Create Ticket' }}
    </button>
  </div>
</form>
