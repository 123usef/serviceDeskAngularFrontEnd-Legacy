<div *ngIf="!submitted">
  <p class="info-text">Enter your email address and we'll send you instructions to reset your password.</p>

  <form #forgotForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        placeholder="Enter your email"
        [(ngModel)]="email"
        required
      />
    </div>

    <button
      type="submit"
      class="btn btn-primary btn-block"
      [disabled]="forgotForm.invalid"
    >
      Send Reset Link
    </button>
  </form>

  <div class="form-footer">
    <a routerLink="/auth/login">Back to Sign In</a>
  </div>
</div>

<div *ngIf="submitted" class="success-message">
  <p>If an account exists for <strong>{{ email }}</strong>, you will receive password reset instructions shortly.</p>
  <a routerLink="/auth/login" class="btn btn-primary btn-block">Back to Sign In</a>
</div>
